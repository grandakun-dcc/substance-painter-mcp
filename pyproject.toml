[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "SubstancePainter-MCP"
version = "1.0.0"
description = "Unified mult-instance MCP and workflow tools for Adobe Substance 3D Painter"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt"]
dependencies = ["mcp>=1.26,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "jsonschema>=4,<5", "build>=1,<2"]

[project.scripts]
SubstancePainter-MCP = "substancepainter_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/substancepainter_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"licenses" = "substancepainter_mcp/licenses"
"THIRD_PARTY_NOTICES.md" = "substancepainter_mcp/THIRD_PARTY_NOTICES.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
